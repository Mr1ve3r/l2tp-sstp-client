# Single source of truth for dependency and SDK versions (SPEC phase 1.1.3).
#
# Note on plugin versions: Gradle cannot resolve a version catalog inside the
# `plugins {}` block of `settings.gradle.kts`, so the plugin versions below are
# mirrored literally in `android/settings.gradle.kts`. Keep the two in sync.

[versions]
agp = "8.11.1"
kotlin = "2.2.20"
ktlint-plugin = "12.1.1"
# KSP's version is bound to the Kotlin compiler it runs inside: the suffix after
# the Kotlin version is KSP's own. Move this whenever `kotlin` moves.
ksp = "2.2.20-2.0.4"

# Android SDK levels. `:app` inherits compileSdk/targetSdk from the Flutter
# Gradle plugin; the library modules cannot see that extension, so they pin the
# same values here. If a Flutter upgrade moves `flutter.compileSdkVersion`,
# move `compile-sdk` with it or AGP will reject the library artifacts.
compile-sdk = "36"
min-sdk = "31"

coroutines = "1.9.0"
androidx-annotation = "1.8.2"
androidx-core = "1.15.0"
netty = "4.2.12.Final"
room = "2.8.4"

junit = "4.13.2"
androidx-test-junit = "1.1.5"
androidx-test-runner = "1.2.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
netty-codec-socks = { module = "io.netty:netty-codec-socks", version.ref = "netty" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
