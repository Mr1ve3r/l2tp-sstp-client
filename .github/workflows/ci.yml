name: CI

on:
  pull_request:
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**
      # Phase branches from the SPEC implementation plan. Each phase has build
      # and test acceptance criteria, so they need CI before they are merged.
      - spec/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.2

defaults:
  run:
    shell: bash

jobs:
  flutter-checks:
    name: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --enforce-lockfile, because the release workflow uses it and this job is
      # the only place a drifted lockfile can be caught before a tag is cut.
      # Running any Flutter tooling locally on a different SDK rewrites
      # pubspec.lock; a plain `pub get` here re-resolves and says nothing, and
      # the release then fails at `Resolve Flutter dependencies` with the tag
      # already pushed. That is exactly how v0.2.0's first attempt died.
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        if: env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  native-tests:
    name: native-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run native tests
        run: sh tool/run_native_tests.sh

  android-go-tests:
    name: Android Go native tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Download Android Go module dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Run Android Go module tests
        working-directory: android/gvisor
        run: go test ./...

  android-unit-tests:
    name: android-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare Android Go dependencies
        uses: actions/setup-go@v5
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Get dependencies
        run: flutter pub get

      - name: Download Android Go module dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Create Android local.properties
        working-directory: android
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME must be set" >&2
            exit 1
          fi

          {
            echo "flutter.sdk=${flutter_root}"
            echo "sdk.dir=${android_sdk_root}"
          } > local.properties

      - name: Check Kotlin style in the engine and core modules
        working-directory: android
        run: ./gradlew --no-daemon --console=plain --stacktrace --continue -Dorg.gradle.vfs.watch=false ktlintCheck

      # Job logs are only readable by repository admins. Re-emitting the ktlint
      # report as workflow annotations puts the findings on the check run, where
      # the public API can reach them.
      - name: Surface ktlint findings
        if: failure()
        run: |
          shopt -s nullglob globstar
          found=0
          for report in build/**/reports/ktlint/**/*.txt; do
            while IFS= read -r line; do
              [ -z "${line}" ] && continue
              echo "::error title=ktlint::${line}"
              found=1
            done < "${report}"
          done
          if [ "${found}" -eq 0 ]; then
            echo "::error title=ktlint::ktlintCheck failed without producing a report -- the failure is in task configuration or plugin resolution, not in lint findings"
          fi

      - name: Run Android JVM tests
        working-directory: android
        run: ./gradlew --no-daemon --console=plain --info --stacktrace -Dorg.gradle.vfs.watch=false :app:testDebugUnitTest

      - name: Run engine and core module unit tests
        working-directory: android
        run: |
          ./gradlew --no-daemon --console=plain --stacktrace -Dorg.gradle.vfs.watch=false \
            :engine-api:testDebugUnitTest \
            :engine-l2tp:testDebugUnitTest \
            :engine-sstp:testDebugUnitTest \
            :core-tunnel:testDebugUnitTest \
            :core-trust:testDebugUnitTest

      # SPEC 11.4 puts a floor under this one module: it holds the trust
      # policies, and a regression there is a silent downgrade of what the
      # application will accept as a server. The task fails the job below 80%.
      - name: Verify core-trust coverage
        working-directory: android
        run: >-
          ./gradlew --no-daemon --console=plain --stacktrace
          -Dorg.gradle.vfs.watch=false :core-trust:jacocoCoverageVerification

      - name: Upload core-trust coverage to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/core-trust/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          flags: core-trust
          fail_ci_if_error: true

      - name: Upload Android test results to Codecov
        if: ${{ !cancelled() && env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: android/app/build/test-results/testDebugUnitTest/*.xml
          report-type: test_results
          disable-search: true

      - name: Upload Android unit test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/build/reports/
          if-no-files-found: ignore

  build-debug-apk:
    name: build-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - native-tests
      - android-go-tests
      - android-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare Android Go dependencies
        uses: actions/setup-go@v5
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Get dependencies
        run: flutter pub get

      - name: Download Android Go module dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Create Android local.properties
        working-directory: android
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME must be set" >&2
            exit 1
          fi

          {
            echo "flutter.sdk=${flutter_root}"
            echo "sdk.dir=${android_sdk_root}"
          } > local.properties

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: l2tp-sstp-client-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build-android:
    name: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - flutter-checks
      - native-tests
      - android-go-tests
      - android-unit-tests
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare Android Go dependencies
        uses: actions/setup-go@v5
        with:
          go-version-file: android/gvisor/go.mod
          cache: true
          cache-dependency-path: android/gvisor/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Get dependencies
        run: flutter pub get

      - name: Download Android Go module dependencies
        working-directory: android/gvisor
        run: go mod download

      - name: Create Android local.properties
        working-directory: android
        run: |
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ -z "${android_sdk_root}" ]]; then
            echo "ANDROID_SDK_ROOT or ANDROID_HOME must be set" >&2
            exit 1
          fi

          {
            echo "flutter.sdk=${flutter_root}"
            echo "sdk.dir=${android_sdk_root}"
          } > local.properties

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TUNNEL_FORGE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
        run: |
          for var in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "Missing required GitHub Actions secret: ${var}" >&2
              exit 1
            fi
          done

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${TUNNEL_FORGE_ANDROID_KEYSTORE_PATH}"
          chmod 600 "${TUNNEL_FORGE_ANDROID_KEYSTORE_PATH}"

      - name: Build release APK
        env:
          TUNNEL_FORGE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          TUNNEL_FORGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TUNNEL_FORGE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TUNNEL_FORGE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: l2-ss-tp-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-reports
          path: |
            build/reports/
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
